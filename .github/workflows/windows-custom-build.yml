name: Windows Custom Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: "master"
  push:
    branches:
      - "master"

jobs:
  buildwindows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v3

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake CONFIG+=release SavvyCAN.pro
          nmake /C

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "release/SavvyCAN.exe" package/
          New-Item -ItemType Directory -Force package/translations | Out-Null
          Copy-Item translations/*.qm package/translations/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force package/help/images | Out-Null
          Copy-Item help/*.md package/help/ -ErrorAction SilentlyContinue
          Copy-Item help/images/*.* package/help/images/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force package/examples | Out-Null
          Copy-Item examples/*.* package/examples/ -ErrorAction SilentlyContinue
          & "${Env:Qt5_Dir}/bin/windeployqt.exe" --release --compiler-runtime package/SavvyCAN.exe
          New-Item -ItemType Directory -Force package/canbus | Out-Null
          Copy-Item "${Env:Qt5_Dir}/plugins/canbus/*.dll" package/canbus/

      - name: Create release ZIP
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath SavvyCAN-Windows-x64-custom.zip -Force

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Windows_x64-text-output
          path: package

      - name: Publish custom development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: SavvyCAN Windows Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: SavvyCAN-Windows-x64-custom.zip
          body: |
            Windows x64 build from commit: ${{ github.sha }}
            Includes the corrected 666.666 kbit/s (666666 bit/s) CAN bitrate option for Vector CANcaseXL.
